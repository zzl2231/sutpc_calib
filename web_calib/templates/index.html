<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>激光雷达外参标定</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div>
      <h1>激光雷达外参</h1>
      <p>点云已变到 base_link。点击数值后用滚轮增减。页面聚焦时按空格暂停或继续。</p>
    </div>
    <div class="controls">
      <label class="step">平移步长 m<input id="step-trans" type="number" min="0.0001" step="0.01" value="0.01"></label>
      <label class="step">角度步长 °<input id="step-angle" type="number" min="0.001" step="0.1" value="0.1"></label>
      <button id="pause" type="button">暂停</button>
      <span id="play-state">等待播放器</span>
      <button id="reset" type="button">恢复初始值</button>
      <button id="save" type="button">保存</button>
    </div>
  </header>
  <p id="notice"></p>
  <main>
    {% for lidar in lidars %}
    <section class="lidar" data-id="{{ lidar.id }}">
      <h2><i style="background: {{ lidar.color }}"></i>{{ lidar.label }}</h2>
      <p class="meta"><span class="count">尚无点云</span>{% if lidar.note %} · {{ lidar.note }}{% endif %}</p>
      <label>x 前向 m<input data-field="x" type="number" step="0.01"></label>
      <label>y 左向 m<input data-field="y" type="number" step="0.01"></label>
      <label>z 向上 m<input data-field="z" type="number" step="0.01"></label>
      <label>roll °<input data-field="roll" data-angle="1" type="number" step="0.1"></label>
      <label>pitch °<input data-field="pitch" data-angle="1" type="number" step="0.1"></label>
      <label>yaw °<input data-field="yaw" data-angle="1" type="number" step="0.1"></label>
    </section>
    {% endfor %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
