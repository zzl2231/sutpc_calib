# ---- GNSS 天线（chcnav）----
# link 名必须为 gnss（与 nav_sat_fix 的 header.frame_id 完全一致）
# 适配器输出的航向已是 base_link 航向；gnss_poser 会叠加 gnss -> base_link 旋转，因此这里 yaw 必须为 0。
# 量天线相对后轴中心的位置，按本文件约定：x=前向，y=左向，z=高度
gnss_base_link:
  x: 0.0      # ← 实测：天线在后轴中心前方为正（m）
  y: 0.0      # ← 实测：天线在左向的偏移（m）
  z: 2.5      # ← 实测：车顶天线高度（m）
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
