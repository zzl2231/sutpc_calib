# ==========================================================================
# 各雷达外参：xxx_base_link 相对 base_link
#   key 名  = <雷达 frame_id> + "_base_link"
#   link 名 = 雷达 frame_id（与 hesai_ros_driver config 里 ros_frame_id 完全一致，
#             驱动发的点云直接落在 TF 树上，无需改驱动）
# 单位：m / rad（RPY 为固定轴 XYZ 欧拉角）

#
# 坐标系约定（车身坐标系，右手系）：
#   X+ → 前
#   Y+ → 左
#   Z+ → 上
#   yaw 角：0=朝前, π/2=朝左, π=朝后, -π/2=朝右
#
# 摄像头说明：
#   key 名  = <相机 frame_id> + "_base_link"
#   link 名 = 相机 frame_id（与相机驱动 ros_frame_id 一致）
#   宏生成两个 link：
#     <child_link>              → 相机本体坐标系（与 calib 外参对齐）
#     <child_link>_optical      → ROS 图像标准坐标系（Z前 X右 Y下）
#                                 rpy={-π/2, 0, -π/2} 固定旋转，无需标定
#   驱动发布图像/CameraInfo 的 frame_id 应设为 <child_link>_optical
#   外参 calib 中的 yaw 按车身坐标系朝向填写（同雷达约定），optical 旋转由 URDF 自动完成
# ==========================================================================

# Suta 官方文件保留的全零 key：支架原点自身
base_link:
  x: 0.0
  y: 0.0
  z: 0.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

